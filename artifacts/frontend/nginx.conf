server {
  listen ${PORT};
  server_name _;
  server_tokens off;

  client_max_body_size 25m;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-hYVmKNLP+Hvn+dMTWP651LWQlidqNLAh+D2W8JJQESA=' https://widget.intercom.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.cdnfonts.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org https://*.intercom.io wss://*.intercom.io; frame-src 'self' https://www.google.com https://*.intercom.io; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self';" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(self), clipboard-read=(self), clipboard-write=(self), display-capture=(self), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), hid=(), microphone=(self), midi=(), payment=(), publickey-credentials-get=(self), usb=(), xr-spatial-tracking=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend "${BACKEND_URL}";
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
