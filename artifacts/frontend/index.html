<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5533CC" />
    <script>
      (function () {
        var KEY = "carecliq-theme";
        var LEGACY = "cc-theme";
        var mode = "system";
        try {
          var stored = localStorage.getItem(KEY);
          if (stored === "light" || stored === "dark" || stored === "system") {
            mode = stored;
          } else {
            var legacy = localStorage.getItem(LEGACY);
            if (legacy === "light" || legacy === "dark") {
              mode = legacy;
              localStorage.setItem(KEY, legacy);
            }
            localStorage.removeItem(LEGACY);
          }
        } catch (e) {}
        var isDark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", isDark);
        root.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CareCliQ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CareCliQ</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
