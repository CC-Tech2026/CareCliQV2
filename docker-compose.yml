services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      PORT: "8000"
      TZ: Australia/Adelaide
      APP_TIMEZONE: Australia/Adelaide
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - ./backend/secrets:/app/backend/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: artifacts/frontend/Dockerfile
      args:
        VITE_DEV_CONSOLE_PASSWORD: ${VITE_DEV_CONSOLE_PASSWORD:-}
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        SUPABASE_REGION: ${SUPABASE_REGION:-ap-southeast-2}
        SUPABASE_REGION_CHECK: ${SUPABASE_REGION_CHECK:-enabled}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "80"
    ports:
      - "3000:80"
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: artifacts/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    restart: unless-stopped

  k6:
    build:
      context: .
      dockerfile: performance/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      K6_BASE_URL: ${K6_BASE_URL:-http://backend:8000}
      K6_ENV: ${K6_ENV:-Local}
      K6_TEST_NAME: ${K6_TEST_NAME:-load}
      K6_COORDINATOR_EMAIL: ${K6_COORDINATOR_EMAIL:-}
      K6_COORDINATOR_PASSWORD: ${K6_COORDINATOR_PASSWORD:-}
      K6_WORKER_EMAIL: ${K6_WORKER_EMAIL:-}
      K6_WORKER_PASSWORD: ${K6_WORKER_PASSWORD:-}
      K6_SAVE_HISTORY: ${K6_SAVE_HISTORY:-false}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./performance:/app/performance
