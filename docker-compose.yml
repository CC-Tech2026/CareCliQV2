services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      PORT: "8000"
    ports:
      - "8000:8000"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: artifacts/frontend/Dockerfile
      args:
        VITE_DEV_CONSOLE_PASSWORD: ${VITE_DEV_CONSOLE_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "80"
    ports:
      - "3000:80"
    restart: unless-stopped
