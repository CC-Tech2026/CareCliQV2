# Production API: https://api.carecliq.com.au (Fly app carecliq-api).
# Deploy with:  flyctl deploy --config fly.production.toml --remote-only
# Dev stays on fly.toml (carecliq-api-dev). Setup: docs/production-setup.md.

app = 'carecliq-api'
primary_region = 'syd'

[build]
  dockerfile = 'backend/Dockerfile'

[deploy]
  # Applies new SQL files in backend/supabase/migrations before the release
  # goes live. Needs the DATABASE_URL secret (set during setup, unlike dev).
  release_command = 'python -m backend.scripts.migrate'

[env]
  TZ = 'Australia/Adelaide'
  APP_TIMEZONE = 'Australia/Adelaide'
  FRONTEND_BASE_URL = 'https://app.carecliq.com.au'
  FRONTEND_URL = 'https://app.carecliq.com.au'
  CORS_ORIGINS = 'https://app.carecliq.com.au'
  # No preview-site wildcard in production.
  CORS_ORIGIN_REGEX = ''

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Always one machine up: customers shouldn't wait on a cold start to sign in.
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
