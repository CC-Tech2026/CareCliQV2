# OWASP ZAP — Frontend vulnerability baseline scan
#
# Builds the production frontend Docker image (nginx), serves it locally,
# and runs a ZAP baseline (passive) scan so PRs get security feedback quickly.
#
# Reports: HTML / Markdown / JSON uploaded as workflow artifacts.
# Rules:   .zap/rules.tsv (TAB-separated) to IGNORE / WARN noisy alerts.

name: OWASP ZAP — Security Scan

on:
  pull_request:
    branches: [develop, staging, main]
    paths:
      - "artifacts/frontend/**"
      - "lib/api-client-react/**"
      - ".zap/**"
      - ".github/workflows/zap-frontend.yml"
  push:
    branches: [develop, main]
    paths:
      - "artifacts/frontend/**"
      - "lib/api-client-react/**"
      - ".zap/**"
      - ".github/workflows/zap-frontend.yml"
  schedule:
    # Weekly Monday 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: zap-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build-time env
        id: env
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL_SECRET:-https://example.supabase.co}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY_SECRET:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder}" >> "$GITHUB_ENV"
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build frontend image
        run: |
          docker build \
            -f artifacts/frontend/Dockerfile \
            --build-arg SUPABASE_URL="$SUPABASE_URL" \
            --build-arg SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-arg SUPABASE_REGION=ap-southeast-2 \
            --build-arg SUPABASE_REGION_CHECK=disabled \
            -t frontend-zap:ci \
            .

      - name: Start frontend container
        run: |
          docker run -d --name frontend-zap \
            -p 3000:80 \
            -e BACKEND_URL=http://127.0.0.1:8000 \
            -e PORT=80 \
            frontend-zap:ci
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:3000" >/dev/null; then
              echo "Frontend ready on :3000"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          docker logs frontend-zap || true
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: "http://127.0.0.1:3000"
          rules_file_name: ".zap/rules.tsv"
          # -a ajax spider (better SPA coverage)
          # -I do not fail the container on WARN-level alerts
          cmd_options: "-a -I"
          fail_action: false
          allow_issue_writing: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          issue_title: "ZAP Frontend Baseline Report"
          artifact_name: zap-frontend-report

      - name: Stop frontend container
        if: always()
        run: docker rm -f frontend-zap || true
