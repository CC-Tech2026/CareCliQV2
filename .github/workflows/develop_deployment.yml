# name: Deploy → Develop

# # ─────────────────────────────────────────────────────────────────────────────
# # Triggers:
# #   push to develop   → CI + build + push images + deploy to dev server
# #   push to ci/*      → CI + build only (no push, no deploy — for testing CI)
# #   PR to develop     → CI + build only (no push, no deploy)
# #
# # Required GitHub Environment "develop" secrets:
# #   SUPABASE_URL              – dev Supabase project URL
# #   SUPABASE_ANON_KEY         – dev anon key
# #   SUPABASE_SERVICE_ROLE_KEY – dev service role key
# #   SESSION_SECRET            – random secret for JWT signing
# #   OPENAI_API_KEY            – OpenAI key (can be dev key)
# #   ANTHROPIC_API_KEY         – Anthropic key
# #
# # Required GitHub Environment "develop" variables (vars.*):
# #   APP_URL                   – public URL shown in the GitHub UI (e.g. https://dev.carescribe.app)
# #
# # Required GitHub Environment "develop" deployment secrets:
# #   DEPLOY_HOST               – IP or hostname of dev server
# #   DEPLOY_USER               – SSH username (e.g. ubuntu)
# #   DEPLOY_SSH_KEY            – contents of the SSH private key
# #   DEPLOY_PATH               – absolute path to deployment dir on server
# #                               (must contain a docker-compose.prod.yml — see below)
# #
# # Server-side setup:
# #   The deployment dir ($DEPLOY_PATH) must contain:
# #     .env               – app env vars (copy from .env.example, fill in values)
# #     docker-compose.prod.yml – compose file that uses pre-built images:
# #
# #       services:
# #         backend:
# #           image: ${BACKEND_IMAGE}
# #           env_file: .env
# #           ports: ["8000:8000"]
# #           restart: unless-stopped
# #         frontend:
# #           image: ${FRONTEND_IMAGE}
# #           ports: ["3000:80"]
# #           restart: unless-stopped
# #           depends_on: [backend]
# # ─────────────────────────────────────────────────────────────────────────────

