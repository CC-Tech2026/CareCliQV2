# name: Deploy → Production

# # ─────────────────────────────────────────────────────────────────────────────
# # Triggers:
# #   push to main      → CI + build + push images + manual approval gate + deploy
# #   PR to main        → CI + build only (no push, no deploy)
# # Flow: CI → Docker build & push → manual approval gate → SSH deploy.
# #
# # IMPORTANT — set up a GitHub Environment named "production" with:
# #   • "Required reviewers" enabled (Settings → Environments → production)
# #     so every production deploy needs explicit approval before it runs.
# #   • Protection rule: only allow deployments from the `main` branch.
# #
# # Images are tagged with BOTH a stable `production` label AND a unique
# # `production-<sha>` tag so rollbacks are trivial:
# #   docker pull ghcr.io/<org>/<repo>/backend:production-abc1234
# #
# # Required GitHub Environment "production" secrets:
# #   SUPABASE_URL              – production Supabase project URL
# #   SUPABASE_ANON_KEY
# #   SUPABASE_SERVICE_ROLE_KEY
# #   SESSION_SECRET
# #   OPENAI_API_KEY
# #   ANTHROPIC_API_KEY
# #   DEPLOY_HOST
# #   DEPLOY_USER
# #   DEPLOY_SSH_KEY
# #   DEPLOY_PATH
# #
# # Required GitHub Environment "production" variables:
# #   APP_URL                   – e.g. https://app.carescribe.app
# # ─────────────────────────────────────────────────────────────────────────────

