# name: CI — Lint · Test · Build

# ─────────────────────────────────────────────────────────────────────────────
# This is the single source of truth for CI.
#
# Triggered in two ways:
#   1. Directly – on every PR targeting develop / staging / main.
#   2. As a reusable workflow – called by the environment-specific deploy
#      workflows (develop_deployment.yml, staging_deployment.yml,
#      production_deployment.yml) so they never skip CI.
#
# Required repo / environment secrets:
#   SUPABASE_URL              – used only by integration tests (optional for CI)
#   SUPABASE_SERVICE_ROLE_KEY – same
# ─────────────────────────────────────────────────────────────────────────────

