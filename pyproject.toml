[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.136.1",
    "geopy>=2.3.0",
    "httpx>=0.28.1",
    "openai>=2.32.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.27",
    "supabase>=2.29.0",
    "uvicorn[standard]>=0.46.0",
    "pyotp>=2.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "reportlab>=4.2.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
storage-s3 = ["boto3>=1.34.0"]
