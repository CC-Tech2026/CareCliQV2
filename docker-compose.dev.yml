# Dev stack with hot reload — build once, then code changes apply automatically.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Rebuild only when dependencies change (pyproject.toml, pnpm-lock.yaml, etc.).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      PORT: "8000"
      TZ: Australia/Adelaide
      APP_TIMEZONE: Australia/Adelaide
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./pytest.ini:/app/pytest.ini
      - backend_venv:/app/.venv
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: artifacts/frontend/Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "3000"
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_REGION: ${SUPABASE_REGION:-ap-southeast-2}
      SUPABASE_REGION_CHECK: ${SUPABASE_REGION_CHECK:-enabled}
      VITE_DEV_CONSOLE_PASSWORD: ${VITE_DEV_CONSOLE_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  backend_venv:
  frontend_node_modules:
