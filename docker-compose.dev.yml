# Dev stack with hot reload — build once, then code changes apply automatically.
#
#   docker compose -f docker-compose.dev.yml up --build
#
#   Backend:  http://localhost:8000
#   Frontend: http://localhost:3000
#   Mobile:   http://localhost:8081  (Expo web in browser)
#             QR + exp:// URL print in mobile logs (tunnel — Expo Go on physical device)
#
# Physical device: set EXPO_PUBLIC_API_URL in .env to your machine's LAN IP, e.g.
#   EXPO_PUBLIC_API_URL=http://192.168.1.100:8000
# and add that origin to CORS_ORIGINS.
#
# Rebuild only when dependencies change (pyproject.toml, pnpm-lock.yaml, etc.).
# Mobile/frontend source edits hot-reload without rebuild.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      PORT: "8000"
      TZ: Australia/Adelaide
      APP_TIMEZONE: Australia/Adelaide
      # Allow browser clients on frontend (3000), mobile web (8081), and Expo Go on LAN
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/secrets:/app/backend/secrets:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./pytest.ini:/app/pytest.ini
      - backend_venv:/app/.venv
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: artifacts/frontend/Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "3000"
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_REGION: ${SUPABASE_REGION:-ap-southeast-2}
      SUPABASE_REGION_CHECK: ${SUPABASE_REGION_CHECK:-enabled}
      VITE_DEV_CONSOLE_PASSWORD: ${VITE_DEV_CONSOLE_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: artifacts/mobile/Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      # Mobile-only env (preferred). Fall back to root .env if missing.
      - path: artifacts/mobile/.env
        required: false
      - path: .env
        required: false
    environment:
      PORT: "8081"
      NODE_ENV: development
      # Non-interactive (no TTY): skips Expo login prompt; scripts/dev-docker.js
      # prints QR + exp:// URL in compose logs. Do not set CI=1 (disables hot reload).
      EXPO_NO_TELEMETRY: "1"
      # Hot reload in Docker (WSL2/Windows bind mounts need polling)
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      # Prefer artifacts/mobile/.env; root/docker only if unset
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - mobile_node_modules:/app/node_modules
      # Shadow host pnpm symlinks so container uses its own install
      - mobile_package_node_modules:/app/artifacts/mobile/node_modules
    restart: unless-stopped

volumes:
  backend_venv:
  frontend_node_modules:
  mobile_node_modules:
  mobile_package_node_modules:
