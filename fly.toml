# fly.toml app configuration file generated for carecliq-api-dev on 2026-07-27T14:52:26+09:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
app = 'carecliq-api-dev'
primary_region = 'syd'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  TZ = 'Australia/Adelaide'
  APP_TIMEZONE = 'Australia/Adelaide'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024